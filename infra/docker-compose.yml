# 本地开发环境：Postgres 18 + MinIO（S3 兼容）+ Mailpit（本地 SMTP，收下所有邮件，不对外投递）。
# 这里的口令只用于本机开发，线上值在 Railway / Cloudflare 中配置。
name: charpub

services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: charpub_owner
      POSTGRES_PASSWORD: charpub_owner_local
      POSTGRES_DB: charpub
      # locale 不能是 C，否则 pg_trgm 会丢掉 CJK 字符，中文 / 日文搜索会失效
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      # Postgres 18 的镜像把数据放在 /var/lib/postgresql/<主版本>/docker 下，卷挂在上一级。
      # 卷名带主版本号：旧版本的数据目录不能被新版本直接使用，升级时换一个新卷。
      - pgdata18:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charpub_owner -d charpub"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: charpub_local
      MINIO_ROOT_PASSWORD: charpub_local_secret
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 charpub_local charpub_local_secret &&
      for b in public private uploads evidence; do mc mb --ignore-existing local/charpub-local-$$b; done &&
      mc anonymous set download local/charpub-local-public &&
      (mc ilm rule ls local/charpub-local-uploads >/dev/null 2>&1 ||
       mc ilm rule add --expire-days 1 local/charpub-local-uploads)
      "

  # 访客验证邮件等都发到这里：SMTP 在 127.0.0.1:51025，网页界面与 API 在 http://127.0.0.1:58025。
  mailpit:
    image: ghcr.io/axllent/mailpit:v1.31.2
    environment:
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:51025:1025"
      - "127.0.0.1:58025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata18:
  miniodata:
