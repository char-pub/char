# 本地 git hooks（`pnpm install` 时自动安装）。CI 会再跑一遍同样的检查。
pre-commit:
  parallel: true
  jobs:
    - name: gitleaks
      run: gitleaks git --pre-commit --staged --redact --no-banner
    - name: biome
      glob: "*.{js,ts,tsx,jsx,json,jsonc,css}"
      run: pnpm exec biome check --no-errors-on-unmatched {staged_files}
    - name: action-dist
      # Action 的打包产物随仓库提交；改动被打进 bundle 的源码后必须一起提交重新生成的 dist。
      glob: "{packages/core,packages/contracts,packages/cli,actions/publish}/**/*.ts"
      run: pnpm check:action-dist >/dev/null || { echo "actions/publish/dist 已过期：重新生成后请 git add actions/publish/dist"; exit 1; }
