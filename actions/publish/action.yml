name: char.pub publish
description: Check authored source, run declared author tests and request publication using GitHub OIDC (no long-lived secrets).
author: char-pub
branding:
  icon: upload-cloud
  color: purple

inputs:
  default-policy:
    description: Exact public default Preset release snapshot used by local author tests
    required: false
  path:
    description: Path to char.yaml inside the repository.
    required: false
    default: char.yaml
  dependencies:
    description: Newline-separated local dependency Release snapshot JSON paths (exact pins).
    required: false
  label:
    description: Release label, e.g. 1.2.0. Defaults to the tag name when triggered by a tag push.
    required: false
  visibility:
    description: public or private.
    required: false
    default: public
  registry:
    description: Registry API base URL. Also used as the OIDC audience.
    required: false
    default: https://api.char.pub
  dry-run:
    description: Only check and build; do not publish.
    required: false
    default: "false"

outputs:
  release:
    description: The id of the published release.
  semantic-digest:
    description: Semantic digest of the creation that was published.

runs:
  using: node24
  main: dist/index.js
